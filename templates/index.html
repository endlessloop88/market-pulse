
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>MarketPulse - Fiyat Takip Motoru</title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #121212; color: #e0e0e0; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 400px;">
        <h2 style="color: #00ffcc; text-align: center;">MarketPulse Web</h2>

        <form method="POST">
            <label>Ürün Adı:</label><br>
            <input type="text" name="urun_adi" required style="width: 100%; padding: 8px; margin: 8px 0 15px 0; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px;"><br>

            <label>Güncel Fiyat (TL):</label><br>
            <input type="number" step="any" name="anlik_fiyat" required style="width: 100%; padding: 8px; margin: 8px 0 15px 0; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px;"><br>

            <label>Hedef Fiyat (TL):</label><br>
            <input type="number" step="any" name="hedef_fiyat" required style="width: 100%; padding: 8px; margin: 8px 0 20px 0; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px;"><br>

            <button type="submit" style="width: 100%; padding: 10px; background: #00ffcc; color: #121212; font-weight: bold; border: none; border-radius: 4px; cursor: pointer;">Analiz Et</button>
        </form>

        {% if sonuc %}
            <div style="margin-top: 20px; padding: 12px; background: #252525; border-left: 4px solid #00ffcc; border-radius: 4px;">
                <p style="margin: 0; font-size: 14px;">{{ sonuc }}</p>
            </div>
        {% endif %}
    </div>
</body>
</html>
